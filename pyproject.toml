[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shop_assistant"
version = "0.1.0"
description = "A lightweight RAG toolkit built from scratch"
requires-python = ">=3.14"

dependencies = [
    "numpy",
    "sentence-transformers",
    "openai"
]

[tool.setuptools.packages.find]
where = ["src"]
